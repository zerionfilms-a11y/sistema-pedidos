<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sistema de Pedidos</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h2>⚡ Sistema</h2>
    <nav>
      <button onclick="navegar('produtos')">Produtos</button>
      <button onclick="navegar('pedidos')">Pedidos</button>
      <button onclick="navegar('despesas')">Despesas</button>
      <button onclick="navegar('dashboard')">Dashboard</button>
      <hr>
      <button onclick="exportarBackup()">Exportar Backup</button>
      <input id="importFile" type="file" style="display:none" onchange="importarBackup(event)"/>
      <button onclick="document.getElementById('importFile').click()">Importar Backup</button>
    </nav>
  </aside>

  <main class="main">
    <section id="produtos" class="pagina">
      <header><h1>Produtos</h1><button class="primary" onclick="abrirModalProduto()">Novo Produto</button></header>
      <div id="produtosList"></div>
    </section>

    <section id="pedidos" class="pagina" style="display:none;">
      <header><h1>Pedidos</h1><button class="primary" onclick="abrirModalPedido()">Novo Pedido</button></header>
      <div id="pedidosList"></div>
    </section>

    <section id="despesas" class="pagina" style="display:none;">
      <header><h1>Despesas</h1><button class="primary" onclick="abrirModalDespesa()">Nova Despesa</button></header>
      <div id="despesasList"></div>
    </section>

    <section id="dashboard" class="pagina" style="display:none;">
      <header><h1>Dashboard</h1></header>
      <div class="cards">
        <div class="card"><h3>Faturamento</h3><p id="cardFaturamento">R$ 0,00</p></div>
        <div class="card"><h3>Despesa</h3><p id="cardDespesa">R$ 0,00</p></div>
        <div class="card"><h3>Lucro</h3><p id="cardLucro">R$ 0,00</p></div>
        <div class="card"><h3>Pedidos em aberto</h3><p id="cardPedidosAbertos">0</p></div>
      </div>
      <canvas id="chartVendas" style="max-width:700px;margin-top:20px"></canvas>
    </section>
  </main>
</div>

<div id="modalProduto" class="modal" style="display:none">
  <div class="modal-content">
    <h3 id="modalProdutoTitle">Novo Produto</h3>
    <label>Nome<input id="pNome"></label>
    <label>Descrição<input id="pDescricao"></label>
    <label>Preço de Custo<input id="pCusto" type="number" step="0.01"></label>
    <label>Preço de Venda<input id="pPreco" type="number" step="0.01"></label>
    <label>Estoque<input id="pEstoque" type="number" step="1"></label>
    <label>Categoria<input id="pCategoria"></label>
    <label>Imagem (opcional)<input id="pImagem" type="file" accept="image/*"></label>
    <div class="actions">
      <button onclick="fecharModalProduto()">Cancelar</button>
      <button class="primary" onclick="salvarProduto()">Salvar</button>
    </div>
  </div>
</div>

<div id="modalPedido" class="modal" style="display:none">
  <div class="modal-content large">
    <h3>Novo Pedido</h3>
    <div class="grid-3">
      <label>Nome do cliente *<input id="pedCliente" placeholder="Nome completo"></label>
      <label>Telefone<input id="pedTelefone" placeholder="(99) 99999-9999"></label>
      <label>Canal de venda
        <select id="pedCanal" onchange="atualizarCamposCanal()">
          <option value="whatsapp">WhatsApp</option>
          <option value="instagram">Instagram</option>
          <option value="facebook">Facebook</option>
          <option value="outro">Outro</option>
        </select>
      </label>
    </div>

    <div id="campoInstagramPedido" style="display:none">
      <label>@ do Instagram<input id="pedInstagram" placeholder="@cliente"></label>
    </div>

    <div class="grid-3">
      <label>CPF (opcional)<input id="pedCpf"></label>
      <label>Endereço (opcional)<input id="pedEndereco"></label>
      <label>Status inicial
        <select id="pedStatusInicial">
          <option value="produzindo">Produzindo</option>
          <option value="pendente">Pendente</option>
        </select>
      </label>
    </div>

    <div class="grid-3">
      <label>Tipo de frete
        <select id="pedFreteTipo">
          <option value="PAC">PAC</option>
          <option value="SEDEX">SEDEX</option>
          <option value="Outro">Outro</option>
        </select>
      </label>
      <label>Valor do frete<input id="pedFreteValor" type="number" step="0.01" min="0" placeholder="0,00"></label>
      <label>Observação do frete<input id="pedFreteObs" placeholder="Opcional"></label>
    </div>

    <label>Observações gerais<textarea id="pedObs" rows="3" placeholder="Detalhes do pedido, cores, tamanhos, etc."></textarea></label>

    <h4>Itens</h4>
    <div class="grid-4">
      <select id="pedProdutoSelect"></select>
      <input id="pedQtd" type="number" min="1" value="1">
      <input id="pedItemObs" placeholder="Obs. da personalização">
      <button onclick="adicionarItemTempPedido()">Adicionar Item</button>
    </div>
    <table id="itensTempPed" class="table">
      <thead><tr><th>Produto</th><th>Qtd</th><th>Obs.</th><th>Preço</th><th>Subtotal</th><th></th></tr></thead>
      <tbody></tbody>
    </table>

    <div class="row between" style="margin-top:12px">
      <div class="small">O frete entra separado no total e no PDF.</div>
      <div>
        <button onclick="fecharModalPedido()">Cancelar</button>
        <button class="primary" onclick="salvarPedido()">Salvar Pedido</button>
      </div>
    </div>
  </div>
</div>

<div id="modalRastreio" class="modal" style="display:none">
  <div class="modal-content">
    <h3>Informar código de rastreio</h3>
    <label>Código de rastreio<input id="rastreioCodigo" placeholder="AA123456789BR"></label>
    <label>Observação (opcional)<input id="rastreioObs" placeholder="Ex.: saiu para envio hoje"></label>
    <div class="actions">
      <button onclick="fecharModalRastreio()">Cancelar</button>
      <button class="primary" onclick="confirmarEnvioPedido()">Salvar e enviar</button>
    </div>
  </div>
</div>

<div id="modalDespesa" class="modal" style="display:none">
  <div class="modal-content">
    <h3>Nova Despesa</h3>
    <label>Descrição<input id="dDesc"></label>
    <label>Valor<input id="dValor" type="number" step="0.01"></label>
    <label>Data<input id="dData" type="date"></label>
    <div class="actions">
      <button onclick="fecharModalDespesa()">Cancelar</button>
      <button class="primary" onclick="salvarDespesa()">Salvar</button>
    </div>
  </div>
</div>

<div id="printArea" style="position:fixed;left:-9999px;top:-9999px"></div>
<script src="app.js"></script>
</body>
</html>
